name: Node.js CI/CD Pipeline

# 1. Define the Triggers
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Define the Jobs
jobs:
  # Continuous Integration (CI) Job
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Dependencies
      run: npm install

    - name: Run Linter & Tests
      run: |
        npm run lint --if-present
        npm test

  # Continuous Deployment (CD) Job
  deploy:
    needs: build-and-test # Only runs if the CI job passes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Only deploy on true pushes, not PRs

    steps:
    - name: Deploying Application
      run: echo "Deploying your application to the production server..."
      # In production, replace this with actions like:
      # uses: azure/webapps-deploy@v2 or appleboy/ssh-action@master
