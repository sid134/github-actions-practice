name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Debug and Find package.json
      run: |
        echo "=== Current Location ==="
        pwd
        echo "=== Listing Root Files ==="
        ls -la
        echo "=== Searching for package.json location ==="
        find . -name "package.json"

    - name: Auto-Detect and Install Dependencies
      run: |
        # This script searches for your package.json and runs npm install directly inside its folder
        TARGET_DIR=$(find . -name "package.json" -exec dirname {} \;)
        if [ -z "$TARGET_DIR" ]; then
          echo "ERROR: package.json still cannot be found anywhere in this repository!"
          exit 1
        else
          echo "Found package.json in: $TARGET_DIR"
          cd "$TARGET_DIR"
          npm install
          npm test --if-present
        fi
