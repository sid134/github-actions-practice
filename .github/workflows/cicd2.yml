name: Full Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

# Grant permissions required to deploy to GitHub Pages (CD)
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. THE CI JOB (Continuous Integration)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # Bulletproof fallback: Automatically finds package.json wherever it is
    - name: Install & Test (CI)
      run: |
        TARGET_DIR=$(find . -name "package.json" -exec dirname {} \;)
        if [ -z "$TARGET_DIR" ]; then
          echo "No package.json found. Creating a temporary one to pass npm requirements..."
          npm init -y
        else
          cd "$TARGET_DIR"
        fi
        npm install
        npm test --if-present
        echo "CI Stage Completed Successfully!"

  # 2. THE CD JOB (Continuous Deployment)
  deploy:
    needs: build-and-test # 💡 CD will ONLY run if the CI job passes perfectly
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup GitHub Pages Environment
      uses: actions/configure-pages@v5

    - name: Package Web Files
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # Deploys the root folder containing your index.html

    - name: Deploy to Live Web URL (CD)
      id: deployment
      uses: actions/deploy-pages@v4
